<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Starbucks Executive BI Template</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00704b",
                        "secondary": "#004d33",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231c",
                        "accent-gray": "#f9f9f9"
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f5f8f7;
        }
    </style>
</head>
<body class="bg-background-light text-slate-900 font-display min-h-screen">
<div class="max-w-[1280px] mx-auto p-4 flex flex-col gap-[15px]">
<header class="h-[150px] bg-white rounded-lg shadow-sm flex flex-col justify-between p-6 border border-slate-100">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-primary text-white">
<span class="material-symbols-outlined text-3xl"></span>
</div>
<div>
<h1 class="text-xl font-800 text-slate-900 leading-none">Monitor Estrategico de Rendimiento Retail</h1>
<p class="text-sm text-slate-500 mt-1 uppercase tracking-widest font-semibold">Data &amp; Analytics</p>
</div>
</div>
<div class="flex gap-4">
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Año</label>
<select class="bg-slate-50 border-slate-200 rounded-lg text-sm px-4 py-2 w-32 focus:ring-primary focus:border-primary">
<option></option>
<option>2023</option>
</select>
</div>
<div class="flex flex-col gap-1">
<label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Tipo de Miembro</label>
<select class="bg-slate-50 border-slate-200 rounded-lg text-sm px-4 py-2 w-48 focus:ring-primary focus:border-primary">
<option></option>
<option>Gold Member</option>
<option>Standard</option>
</select>
</div>

</div>
</div>
<div class="grid grid-cols-6 gap-4">
<div class="flex flex-col border-l-4 border-primary bg-slate-50/50 p-2 rounded-r-md">
<span class="text-[10px] font-bold text-slate-500 uppercase">Venta Total</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-slate-900"></span>
<span class="text-[10px] text-primary font-bold"></span>
</div>
</div>
<div class="flex flex-col border-l-4 border-primary bg-slate-50/50 p-2 rounded-r-md">
<span class="text-[10px] font-bold text-slate-500 uppercase">Total Miembros</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-slate-900"></span>
<span class="text-[10px] text-primary font-bold"></span>
</div>
</div>
<div class="flex flex-col border-l-4 border-primary bg-slate-50/50 p-2 rounded-r-md">
<span class="text-[10px] font-bold text-slate-500 uppercase">Ticket Promedio</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-slate-900"></span>
<span class="text-[10px] text-red-500 font-bold"></span>
</div>
</div>
<div class="flex flex-col border-l-4 border-primary bg-slate-50/50 p-2 rounded-r-md">
<span class="text-[10px] font-bold text-slate-500 uppercase">Gasto Comida</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-slate-900"></span>
<span class="text-[10px] text-primary font-bold"></span>
</div>
</div>
<div class="flex flex-col border-l-4 border-primary bg-slate-50/50 p-2 rounded-r-md">
<span class="text-[10px] font-bold text-slate-500 uppercase">% Venta Cruzada</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-slate-900"></span>
<span class="text-[10px] text-primary font-bold"></span>
</div>
</div>
<div class="flex flex-col border-l-4 border-primary bg-slate-50/50 p-2 rounded-r-md">
<span class="text-[10px] font-bold text-slate-500 uppercase">Satisfacción</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-slate-900"></span>
<span class="text-[10px] text-primary font-bold"></span>
</div>
</div>
</div>
</header>
<div class="flex gap-[15px] h-[280px]">
<div class="w-[610px] bg-white rounded-lg border border-slate-100 p-6 flex flex-col shadow-sm">
<div class="flex justify-between items-center mb-6">
<h3 class="text-sm font-bold text-slate-900 uppercase tracking-tight">Analisis de demanda</h3>
<div class="flex gap-2">
<span class="flex items-center gap-1 text-[10px] font-semibold text-slate-400 uppercase">
<span class="w-2 h-2 rounded-full bg-primary"></span> 
                        </span>
<span class="flex items-center gap-1 text-[10px] font-semibold text-slate-400 uppercase">
<span class="w-2 h-2 rounded-full bg-primary/40"></span> 
                        </span>
</div>
</div>

</div>
<div class="w-[610px] bg-white rounded-lg border border-slate-100 p-6 flex flex-col shadow-sm">
<div class="flex justify-between items-center mb-6">
<h3 class="text-sm font-bold text-slate-900 uppercase tracking-tight">Estrategia de canales</h3>
<div class="bg-primary/10 text-primary text-[10px] font-bold px-2 py-1 rounded-full uppercase"></div>
</div>

</div>
</div>
<div class="flex gap-[15px] h-[220px]">
<div class="w-[400px] bg-white rounded-lg border border-slate-100 p-6 flex flex-col shadow-sm">
<h3 class="text-sm font-bold text-slate-900 uppercase tracking-tight mb-4">Distribucion Regional</h3>

</div>
<div class="w-[820px] bg-white rounded-lg border border-slate-100 p-6 flex flex-col shadow-sm">
<div class="flex justify-between items-center mb-4">
<h3 class="text-sm font-bold text-slate-900 uppercase tracking-tight">Correlación de Valor: Impacto de la Satisfacción en el Ticket Promedio</h3>

</div>
<div class="flex-1 flex flex-col justify-end">

</div>
</div>
</div>
</div>
</body></html>
